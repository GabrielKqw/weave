<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 224" width="660" height="224" role="img" aria-labelledby="title desc">
<title id="title">Weave benchmark: output reduction per scenario</title>
<desc id="desc">git status, 30 untracked files: 11.7% reduction. synthetic 300-line passing test: 98.7% reduction. failing assertion: 0.0% reduction. grep, 50 matches: 17.5% reduction.</desc>
<style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #52514e; font-size: 13px; }
    .value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
    .bar { fill: #2a78d6; }
    .baseline { stroke: #c3c2b7; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #c3c2b7; }
      .value { fill: #ffffff; }
      .bar { fill: #3987e5; }
      .baseline { stroke: #383835; }
    }
  </style>
<line class="baseline" x1="270" y1="24" x2="270" y2="204" />
<text class="label" x="260" y="54" text-anchor="end">git status, 30 untracked files</text>
<path class="bar" d="M 270 40 L 303 40 A 4 4 0 0 1 307 44 L 307 56 A 4 4 0 0 1 303 60 L 270 60 Z" />
<text class="value" x="315" y="54">11.7%</text>
<text class="label" x="260" y="98" text-anchor="end">synthetic 300-line passing test</text>
<path class="bar" d="M 270 84 L 582 84 A 4 4 0 0 1 586 88 L 586 100 A 4 4 0 0 1 582 104 L 270 104 Z" />
<text class="value" x="594" y="98">98.7%</text>
<text class="label" x="260" y="142" text-anchor="end">failing assertion</text>
<text class="value" x="278" y="142">0.0%</text>
<text class="label" x="260" y="186" text-anchor="end">grep, 50 matches</text>
<path class="bar" d="M 270 172 L 322 172 A 4 4 0 0 1 326 176 L 326 188 A 4 4 0 0 1 322 192 L 270 192 Z" />
<text class="value" x="334" y="186">17.5%</text>
</svg>
