description = "Switch Weave mode (off/lite/full/ultra)"
prompt = "Switch to weave {{args}} mode. If no level specified, use full. Trace the affected flow before editing; fix shared causes, not isolated symptoms. Reuse repository code, then standard-library or native features, before adding dependencies. Make the smallest correct change and verify it with real evidence. Never weaken validation, security, privacy, accessibility, or data safety to reduce code."
